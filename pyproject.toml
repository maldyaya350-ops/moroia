[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moroia"
version = "3.6.0"
authors = [
    { name = "Malek", email = "maldyaya350@gmail.com" }
]
description = "Professional Python CLI & Library for hardware audits, storage inspection, and networking diagnostic telemetry. Run 'moroia' in Terminal."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Networking"
]
dependencies = [
    "requests>=2.28.0",
    "tabulate>=0.9.0",
    "psutil>=5.9.0"
]

[project.scripts]
moroia = "moroia:main"